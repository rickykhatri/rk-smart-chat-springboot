name: Keep Render App Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --show-error --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            "https://rksmartchat.onrender.com/api/health"
